<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Ecommerce</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
    <div class="layout">
        <header class="header">
            <nav class="nav">
                <h1>Mi Ecommerce</h1>
            </nav>
        </header>
        <aside class="aside-bar">
            <h2>Categorias</h2>
            <div class="category-list">
                <ul>
                    <li><a href="#">Perfumes <span>(13)</span></a></li>
                    <li><a href="#">Ropa <span>(21)</span></a></li>
                    <li><a href="#">Accesorios <span>(41)</span></a></li>
                    <li><a href="#">Zapatos <span>(10)</span></a></li>

                </ul>
        </aside>

        <main class="main">
            <section class="producto-grid">
                <article class="card">
                    <img class="card-img" src="assets/img/img1.webp" alt="">
                    <h5 class="card-title">Armani Code Parfum</h5>
                    <p class="card-text">$109.990</p>
                    <a href="#" class="btn btn-primary">Comprar</a>
                </article>
                <article class="card">
                    <img class="card-img" src="assets/img/img2.webp" alt="">
                    <h5 class="card-title">ACQUA DI GIO</h5>
                    <p class="card-text">$99.990</p>
                    <a href="#" class="btn btn-primary">Comprar</a>
                </article>
                <article class="card">
                    <img class="card-img" src="assets/img/img3.jpg" alt="">
                    <h5 class="card-title">Zapato Dockers</h5>
                    <p class="card-text">$49.990</p>
                    <a href="#" class="btn btn-primary">Comprar</a>
                </article>
                <article class="card">
                    <img class="card-img" src="assets/img/img4.avif" alt="">
                    <h5 class="card-title">Poleron Adidas </h5>
                    <p class="card-text">$35.990</p>
                    <a href="#" class="btn btn-primary">Comprar</a>
                </article>
            </section>
        </main>
        <footer class="footer">
            <p>@Mi E-Commerce 2026</p>
        </footer>
    </div>
</body>

</html>
